name: Android CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Prepare demo package
        run: |
          mkdir -p demo
          cp app/build/outputs/apk/debug/app-debug.apk demo/IMCalculator-demo.apk
          cd demo
          sha256sum IMCalculator-demo.apk > IMCalculator-demo.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: IMCalculator-demo
          path: demo/*
          if-no-files-found: error
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: IMCalculator-demo
          path: demo
      - name: Publish demo release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" demo/* \
            --verify-tag \
            --title "IMCalculator $RELEASE_TAG" \
            --notes "Educational Android demo. Includes a debug-signed APK and SHA-256 checksum. Requires Android 7.0 or later. Not a medical device."
